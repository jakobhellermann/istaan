[package]
name = "istaan"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
anstream = "1.0"
anstyle = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
rabex-env = { git = "https://github.com/jakobhellermann/rabex-env" }
rabex = { git = "https://github.com/jakobhellermann/RustyAssetBundleEXtractor" }
rayon = "1.11"
regex = { version = "1.11", default-features = false, features = ["perf", "std"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
istaan-diff-core = { path = "crates/istaan-diff-core" }
istaan-diff-cs = { path = "crates/istaan-diff-cs" }
istaan-diff-json = { path = "crates/istaan-diff-json" }
istaan-diff-unity = { path = "crates/istaan-diff-unity" }

# [patch."https://github.com/jakobhellermann/rabex-env"]
# rabex-env = { path = "/home/jakob/dev/unity/rabex-env" }

# [patch."https://github.com/jakobhellermann/RustyAssetBundleEXtractor"]
# rabex = { path = "/home/jakob/dev/unity/RustyAssetBundleEXtractor" }

[workspace]
members = [".", "crates/*"]
